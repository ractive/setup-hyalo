name: setup-hyalo
description: Install the prebuilt hyalo CLI (markdown knowledgebase linter/query tool) on the runner and add it to PATH.
author: ractive
branding:
  icon: check-circle
  color: blue

inputs:
  version:
    description: >-
      hyalo release to install. Use "latest" (default) to track the newest
      release, or an explicit tag like "v0.17.0" to pin.
    required: false
    default: latest
  github-token:
    description: >-
      Token used for GitHub release-asset API calls (raises the anonymous rate
      limit) and for fetching the archive's build-provenance attestation.
      Defaults to the workflow token.
    required: false
    default: ${{ github.token }}
  verify-attestation:
    description: >-
      Verify the downloaded archive's GitHub build-provenance attestation with
      `gh attestation verify` before installing it (default "true"). Fails the
      step if the attestation is missing or doesn't verify. Set "false" only on
      runners without the gh CLI; integrity then rests on SHA256SUMS alone,
      which an attacker who can replace release assets can replace too.
    required: false
    default: "true"

outputs:
  version:
    description: The resolved hyalo version tag that was installed (e.g. v0.17.0).
    value: ${{ steps.install.outputs.version }}
  provenance:
    description: >-
      How the installed binary's build provenance was established: "verified"
      (attestation checked), "exempt" (a release/target that publishes no
      attestation; SHA256SUMS only, with a warning) or "disabled"
      (verify-attestation is false).
    value: ${{ steps.install.outputs.provenance }}

runs:
  using: composite
  steps:
    - id: install
      uses: ractive/release-workflows/setup@d7439bdb0e54ad188aa818e2ba0f86b5d57a7cdc # v0.8.0
      with:
        repo: ractive/hyalo
        version: ${{ inputs.version }}
        github-token: ${{ inputs.github-token }}
        verify-attestation: ${{ inputs.verify-attestation }}
        # First release whose archives carry attestations (v0.17.0 is partial).
        attested-from: v0.18.0
        # Releases up to v0.26.0 attest no cross-built target
        # (release-workflows skipped them until ractive/release-workflows#9).
        # The exemption is bounded so it expires by itself: any newer release,
        # and so whatever 'latest' resolves to after it, must verify.
        unattested-targets: aarch64-unknown-linux-gnu
        unattested-through: v0.26.0

    - name: Verify hyalo runs
      shell: bash
      run: hyalo --version
