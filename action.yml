name: setup-hyalo
description: Install the prebuilt hyalo CLI (markdown knowledgebase linter/query tool) on the runner and add it to PATH.
author: ractive
branding:
  icon: check-circle
  color: blue

inputs:
  version:
    description: >-
      hyalo release to install. Use "latest" (default) to track the newest
      release, or an explicit tag like "v0.17.0" to pin.
    required: false
    default: latest
  github-token:
    description: >-
      Token used for GitHub release-asset API calls (raises the anonymous rate
      limit) and for fetching the archive's build-provenance attestation.
      Defaults to the workflow token.
    required: false
    default: ${{ github.token }}
  verify-attestation:
    description: >-
      Verify the downloaded archive's GitHub build-provenance attestation with
      `gh attestation verify` before installing it (default "true"). Fails the
      step if the attestation is missing or doesn't verify. Set "false" only on
      runners without the gh CLI; integrity then rests on SHA256SUMS alone,
      which an attacker who can replace release assets can replace too.
    required: false
    default: "true"

outputs:
  version:
    description: The resolved hyalo version tag that was installed (e.g. v0.17.0).
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_HOST: github.com
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        REPO: ractive/hyalo
        # hyalo's release.yml calls this reusable workflow, so the Sigstore
        # certificate's signer identity is release-workflows, not ractive/hyalo:
        # `gh attestation verify --repo ractive/hyalo` alone rejects every release.
        SIGNER_WORKFLOW: ractive/release-workflows/.github/workflows/release.yml
        # First release whose archives carry attestations (v0.17.0 is partial).
        ATTESTED_FROM: v0.18.0
        # No hyalo release so far attests cross-built targets (release-workflows
        # skipped them; fixed in ractive/release-workflows#9). Once a release
        # ships it, replace this exemption with a per-target version floor.
        UNATTESTED_TARGETS: aarch64-unknown-linux-gnu
      run: |
        set -euo pipefail

        case "$INPUT_VERIFY_ATTESTATION" in
          true|false) ;;
          *) echo "::error::setup-hyalo: invalid 'verify-attestation' input '$INPUT_VERIFY_ATTESTATION' — expected 'true' or 'false'"; exit 1 ;;
        esac

        # version_lt A B: true when vX.Y.Z tag A sorts before B (both pre-validated).
        version_lt() {
          local a1 a2 a3 b1 b2 b3
          IFS=. read -r a1 a2 a3 <<< "${1#v}"
          IFS=. read -r b1 b2 b3 <<< "${2#v}"
          [ "$a1" -lt "$b1" ] && return 0; [ "$a1" -gt "$b1" ] && return 1
          [ "$a2" -lt "$b2" ] && return 0; [ "$a2" -gt "$b2" ] && return 1
          [ "$a3" -lt "$b3" ]
        }

        # ---- validate the version input -------------------------------------
        if [ "$INPUT_VERSION" != "latest" ] && ! printf '%s' "$INPUT_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::setup-hyalo: invalid 'version' input '$INPUT_VERSION' — expected 'latest' or a tag like 'v1.2.3'"
          exit 1
        fi

        # ---- detect runner platform → release target ------------------------
        os="$(uname -s)"
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64)   arch=x86_64 ;;
          aarch64|arm64)  arch=aarch64 ;;
          *) echo "::error::setup-hyalo: unsupported CPU architecture '$arch'"; exit 1 ;;
        esac

        ext=tar.gz
        bin=hyalo
        case "$os" in
          Linux)
            # Release ships gnu and musl linux builds; gnu is the safe default on hosted runners.
            target="${arch}-unknown-linux-gnu" ;;
          Darwin)
            if [ "$arch" != "aarch64" ]; then
              echo "::error::setup-hyalo: no prebuilt macOS binary for '$arch' — hyalo publishes aarch64-apple-darwin only. Use an arm64 macOS runner (macos-14 or newer) or 'cargo install hyalo-cli'."
              exit 1
            fi
            target="aarch64-apple-darwin" ;;
          MINGW*|MSYS*|CYGWIN*|Windows_NT)
            target="${arch}-pc-windows-msvc"
            ext=zip
            bin=hyalo.exe ;;
          *) echo "::error::setup-hyalo: unsupported OS '$os'"; exit 1 ;;
        esac
        echo "setup-hyalo: runner detected as ${os}/${arch} -> target ${target}"

        # ---- resolve the version tag ----------------------------------------
        api="https://api.github.com/repos/${REPO}"
        # Bash 3.2 (macOS runners) errors on "${arr[@]}" for an empty array under
        # `set -u`, so guard every expansion with the "${arr[@]+...}" idiom.
        auth=()
        if [ -n "${GH_TOKEN:-}" ]; then
          auth=(-H "Authorization: Bearer ${GH_TOKEN}")
        fi

        if [ "$INPUT_VERSION" = "latest" ]; then
          # Fetch to a variable first: piping curl into `grep -m1` closes the pipe
          # early, and under `pipefail` curl's write error (exit 23) would abort
          # the step. Parse the buffered body instead.
          release_json="$(curl -fsSL ${auth[@]+"${auth[@]}"} -H "Accept: application/vnd.github+json" "${api}/releases/latest")"
          version="$(printf '%s' "$release_json" | grep '"tag_name"' | head -1 | sed -E 's/.*"tag_name" *: *"([^"]+)".*/\1/')"
          if [ -z "$version" ]; then
            echo "::error::setup-hyalo: could not resolve the latest release tag from the GitHub API"
            exit 1
          fi
          # The API-resolved tag feeds paths, the download URL, and GITHUB_OUTPUT
          # (which callers may interpolate into scripts) — hold it to the same
          # format as the explicit input, so a malformed/spoofed API response
          # can't smuggle path traversal or shell metacharacters downstream.
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::setup-hyalo: latest release tag '$version' does not look like a version tag (vX.Y.Z)"
            exit 1
          fi
        else
          version="$INPUT_VERSION"
        fi
        echo "setup-hyalo: installing ${REPO} ${version}"

        # ---- tool cache -----------------------------------------------------
        cache_root="${RUNNER_TOOL_CACHE:-${HOME}/.cache}/hyalo/${version}/${target}"
        if [ -x "${cache_root}/${bin}" ]; then
          echo "setup-hyalo: cache hit at ${cache_root}"
        else
          asset="hyalo-${version}-${target}.${ext}"
          url="https://github.com/${REPO}/releases/download/${version}/${asset}"
          echo "setup-hyalo: downloading ${url}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL ${auth[@]+"${auth[@]}"} -o "${tmp}/${asset}" "$url" \
            || { echo "::error::setup-hyalo: download failed for ${asset} (does release ${version} publish target ${target}?)"; exit 1; }

          # ---- verify the archive against the release's SHA256SUMS ----------
          curl -fsSL ${auth[@]+"${auth[@]}"} -o "${tmp}/SHA256SUMS" \
            "https://github.com/${REPO}/releases/download/${version}/SHA256SUMS" \
            || { echo "::error::setup-hyalo: release ${version} publishes no SHA256SUMS — refusing to install an unverified archive"; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${asset}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${asset}" | awk '{print $1}')"
          fi
          expected="$(awk -v a="$asset" '$2 == a || $2 == "*"a {print $1; exit}' "${tmp}/SHA256SUMS")"
          if [ -z "$expected" ]; then
            echo "::error::setup-hyalo: SHA256SUMS for ${version} has no entry for ${asset}"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::setup-hyalo: checksum mismatch for ${asset} (expected ${expected}, got ${actual})"
            exit 1
          fi
          echo "setup-hyalo: sha256 verified (${actual})"

          # ---- verify build provenance ------------------------------------
          # SHA256SUMS sits next to the archive in the same release, so it only
          # catches corruption: whoever can replace the archive can replace the
          # sums. The Sigstore attestation proves the archive was built by
          # release-workflows from ractive/hyalo on a GitHub-hosted runner.
          # Whenever an attestation should exist, its absence is fatal — a
          # warn-and-continue on "not found" would let a swapped asset (whose
          # new digest has no attestation) straight through.
          if [ "$INPUT_VERIFY_ATTESTATION" = "true" ]; then
            skip_reason=""
            case " ${UNATTESTED_TARGETS} " in
              *" ${target} "*) skip_reason="hyalo releases publish no provenance attestation for ${target} (cross-built)" ;;
            esac
            if [ -z "$skip_reason" ] && version_lt "$version" "$ATTESTED_FROM"; then
              if [ "$INPUT_VERSION" = "latest" ]; then
                # 'latest' is chosen by the release API, i.e. by whoever controls
                # the releases — never let it select an unverifiable version.
                echo "::error::setup-hyalo: 'latest' resolved to ${version}, which predates attested releases (${ATTESTED_FROM}) — refusing to install it unverified"
                exit 1
              fi
              skip_reason="hyalo ${version} predates attested releases (${ATTESTED_FROM})"
            fi

            if [ -n "$skip_reason" ]; then
              echo "::warning::setup-hyalo: ${skip_reason}; installed after SHA256SUMS check only, provenance NOT verified"
            else
              if ! command -v gh >/dev/null 2>&1; then
                echo "::error::setup-hyalo: the gh CLI is required to verify the build-provenance attestation and is not on PATH. Install gh on this runner, or set 'verify-attestation: false' to install without provenance verification."
                exit 1
              fi
              if [ -z "${GH_TOKEN:-}" ]; then
                echo "::error::setup-hyalo: verifying the build-provenance attestation needs a GitHub token — pass 'github-token', or set 'verify-attestation: false'"
                exit 1
              fi
              if ! verify_out="$(gh attestation verify "${tmp}/${asset}" \
                    --repo "$REPO" \
                    --signer-workflow "$SIGNER_WORKFLOW" \
                    --deny-self-hosted-runners 2>&1)"; then
                printf '%s\n' "$verify_out"
                echo "::error::setup-hyalo: build-provenance attestation verification FAILED for ${asset} — refusing to install"
                exit 1
              fi
              echo "setup-hyalo: provenance verified (built by ${SIGNER_WORKFLOW} for ${REPO})"
            fi
          fi

          mkdir -p -m 0755 "$cache_root"
          if [ "$ext" = "zip" ]; then
            unzip -q -o "${tmp}/${asset}" -d "$cache_root"
          else
            tar -xzf "${tmp}/${asset}" -C "$cache_root"
          fi
          if [ ! -x "${cache_root}/${bin}" ]; then
            chmod +x "${cache_root}/${bin}" 2>/dev/null || true
          fi
          if [ ! -e "${cache_root}/${bin}" ]; then
            echo "::error::setup-hyalo: extracted archive did not contain '${bin}'"
            exit 1
          fi
        fi

        # ---- expose on PATH + outputs ---------------------------------------
        echo "$cache_root" >> "$GITHUB_PATH"
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Verify hyalo runs
      shell: bash
      run: hyalo --version
