name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64 (aarch64-apple-darwin) — the only macOS target
        # hyalo ships. (macos-14 was retired: "configuration not supported".)
        # ubuntu-24.04-arm installs aarch64-unknown-linux-gnu, the one target
        # without a provenance attestation: it exercises the warn-and-skip path.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        version: [latest, v0.18.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install hyalo via setup-hyalo
        id: hyalo
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: hyalo --version
        shell: bash
        run: hyalo --version

      - name: Report resolved version
        shell: bash
        env:
          # Pass through env, not direct ${{ }} interpolation into the script
          # body — keeps the smoke workflow free of injection surfaces even
          # though the action validates the tag format.
          RESOLVED: ${{ steps.hyalo.outputs.version }}
        run: echo "resolved=$RESOLVED"

      - name: Assert which provenance path ran
        shell: bash
        env:
          PROVENANCE: ${{ steps.hyalo.outputs.provenance }}
          # aarch64-unknown-linux-gnu is exempt only up to v0.26.0, so only the
          # arm job pinned to v0.18.0 may skip; 'latest' (v0.26.1+, attested)
          # must verify on arm too. Without this a regression that silently
          # skips verification would stay green.
          EXPECTED: ${{ matrix.os == 'ubuntu-24.04-arm' && matrix.version != 'latest' && 'exempt' || 'verified' }}
        run: |
          echo "provenance=$PROVENANCE (expected $EXPECTED)"
          [ "$PROVENANCE" = "$EXPECTED" ]

      - name: Install again (tool-cache hit)
        id: hyalo-cached
        uses: ./
        with:
          version: ${{ steps.hyalo.outputs.version }}

      - name: Assert the cache hit kept the provenance
        shell: bash
        env:
          FIRST: ${{ steps.hyalo.outputs.provenance }}
          SECOND: ${{ steps.hyalo-cached.outputs.provenance }}
        run: |
          echo "first=$FIRST second=$SECOND"
          [ "$FIRST" = "$SECOND" ]

      - name: Lint the fixture vault
        shell: bash
        working-directory: test/fixture-vault
        run: hyalo lint --strict --format github
